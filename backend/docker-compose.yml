services:
  # This is the new backend's own instance, unrelated to the root
  # docker-compose.yml (legacy app/). Decision 6 (REBUILD.md §5, reversed
  # 2026-08-29) means legacy isn't run alongside it — there is no second
  # service here for the Jinja app, on purpose. Default ports differ from
  # the root compose file's (5433/8001, not 5432/8000) so the two *could*
  # still run side by side without a port clash, for the one case
  # decision 6 keeps open: checking out master locally, once, to
  # cross-check a specific figure.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postwarden
      POSTGRES_PASSWORD: postwarden
      POSTGRES_DB: postwarden
    volumes:
      - pgdata:/var/lib/postgresql/data
      # seed_demo.sql is mandatory, not optional, here — REBUILD.md §5
      # decision 6: seed.sql alone has accounts/scenarios/levels but zero
      # journal entries, and an empty ledger can't verify a report.
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ../db/seed_demo.sql:/docker-entrypoint-initdb.d/03_seed_demo.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postwarden -d postwarden"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    # Context is the repo root, not this directory — Dockerfile's own
    # frontend-build stage (Phase 2.1, REBUILD_STATUS.md) needs ../frontend
    # in reach, which a backend/-scoped context can't provide. `dockerfile:`
    # still points at this file since Docker doesn't otherwise look for one
    # outside the context root.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      # +psycopg: the SQLAlchemy-flavored URL scheme (see alembic/env.py's
      # own comment) - not legacy app/db.py's plain postgresql://.
      DATABASE_URL: postgresql+psycopg://postwarden:postwarden@db:5432/postwarden
    ports:
      - "${APP_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
