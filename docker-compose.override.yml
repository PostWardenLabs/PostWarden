# Local dev convenience, merged in automatically by `docker compose up` —
# no flag needed, Compose picks this up whenever it sits next to
# docker-compose.yml. Never touches docker-compose.yml/Dockerfile
# themselves, and has no effect on beta/demo/production, which don't
# have this file.
#
# Bind-mounts ./src over the image's baked-in copy, so the container reads
# the real files on disk instead of a frozen snapshot from build time —
# without this, editing a file on your machine has no effect on the
# running container at all, --reload or not. --reload makes uvicorn watch
# for .py changes and restart itself automatically (~1s) so new Python
# code takes effect without a manual restart.
#
# Doesn't help with a new entry in pyproject.toml's dependencies, an
# alembic/ migration, or anything main.py reads from *outside* ./src at
# startup — VERSION (repo root, read once via Settings) is the one that
# actually bites: bumping it and refreshing the page keeps showing the old
# number, because only ./src is bind-mounted. Not a bug, just this file's
# bind-mount scope working exactly as documented — `docker compose -f
# docker-compose.yml up -d --build` (naming only the base file skips the
# auto-merge) is what actually picks up any of those, and is worth doing
# once before calling something done, same spirit as this project's
# existing "verify against the real thing" testing culture.
#
# Doesn't help with a frontend/ edit either — the built SPA is baked into
# the image at build time (Dockerfile's frontend-build stage), not bind-
# mounted here. Run `npm run dev` inside frontend/ instead for live
# frontend iteration (see frontend/vite.config.ts's own dev-proxy comment).
#
# Delete this file any time to go back to exactly today's (production-
# shaped, non-reloading) behavior by default — nothing else changes.
services:
  app:
    volumes:
      - ./src:/srv/postwarden/src
    command: ["sh", "-c", "alembic stamp head && uvicorn postwarden.main:app --host 0.0.0.0 --port 8000 --reload"]
