name: Deploy beta

# beta.postwarden.org is meant to track PostWarden's master exactly, but
# this workflow lives in PostWardenPublic — a separate repo from the one
# that's actually pushed to — so it can't react to that push directly the
# way it could when both lived together. workflow_dispatch (manual, from
# this repo's Actions tab, or `deploy-beta.sh` run by hand) is the trigger
# for now. The natural fix is a small notify-only step in PostWarden's own
# CI that fires a `repository_dispatch` at this repo on every push to
# master — see this repo's README for why that's not wired up yet (needs a
# one-time PAT/secret added to the *product* repo, real GitHub
# configuration, not something either repo's code alone can set up).
# demo.postwarden.org is deliberately NOT wired to CI at all: it deploys
# from a tag, by hand, on its own "every few weeks" cadence — see
# deploy-demo.sh.
#
# Auth is Workload Identity Federation, not a downloaded service-account
# key: GCP's org policy here disables SA key creation (a good default,
# not a workaround), so this workflow's GitHub-issued OIDC token is
# exchanged for short-lived GCP credentials instead. Nothing long-lived
# to leak if a workflow run is ever compromised.
on:
  workflow_dispatch: {}

permissions:
  id-token: write   # required to mint the OIDC token WIF exchanges
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/205690298805/locations/global/workloadIdentityPools/postwarden-github/providers/postwarden-beta-deploy
          service_account: postwarden-ci-deploy@libro-506506.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # A fresh runner has no ~/.ssh at all. gcloud compute ssh needs it to
      # already exist to generate/store its managed keypair in — without
      # this it fails non-interactively with "The private SSH key file for
      # gcloud does not exist", since it can't create the directory *and*
      # the key in one shot outside a real terminal.
      - name: Ensure ~/.ssh exists
        run: mkdir -p -m 700 ~/.ssh

      # A brand-new runner means a brand-new SSH key gcloud has never used
      # against this VM before, which means a brand-new Linux user on the
      # VM's end too — the guest agent provisioning that user + its
      # authorized_keys sometimes takes a little longer than gcloud's own
      # ~40s retry budget, especially the very first time. gcloud's own
      # error message says as much ("Try running this command again") —
      # a cheap ping loop up front absorbs that instead of failing the
      # whole (much more expensive, docker-build-including) deploy step
      # on a timing fluke.
      - name: Wait for the SSH key to propagate
        run: |
          for i in $(seq 1 6); do
            gcloud compute ssh postwarden-public \
              --zone us-central1-a --project libro-506506 \
              --tunnel-through-iap --command "true" && exit 0
            echo "not ready yet, retrying in 15s ($i/6)"
            sleep 15
          done
          echo "SSH key never propagated" >&2
          exit 1

      - name: Redeploy beta over IAP
        run: |
          gcloud compute ssh postwarden-public \
            --zone us-central1-a --project libro-506506 \
            --tunnel-through-iap -- '
              cd /opt/postwarden-beta &&
              sudo git fetch origin &&
              sudo git reset --hard origin/master &&
              sudo docker compose up -d --build &&
              echo "beta redeployed: $(sudo git rev-parse --short HEAD)"
            '
