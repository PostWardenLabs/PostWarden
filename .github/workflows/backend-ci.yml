name: Backend CI

# Runs the app's test suite against a real Postgres service container.
#
# Two jobs, deliberately kept separate rather than one shared Postgres
# instance:
#   - `test`: apitests/ — the FastAPI app's own suite (Phase 1 onward),
#     installed and migrated via Alembic first. Deliberately a top-level
#     directory, not tests/api/ — pytest loads every conftest.py from the
#     repo root down to each collected path, so nesting this under tests/
#     would mean tests/conftest.py's own pytest_configure (below) fires
#     on every run of this suite too, and it dials a `db` hostname this
#     job's Postgres service doesn't expose.
#   - `invariants`: tests/test_invariants.py + tests/test_cashflow.py —
#     REBUILD.md §3's "60 pure-Postgres tests," the actual safety net this
#     whole rebuild leaned on. These apply db/schema.sql directly
#     (tests/conftest.py's own CREATE DATABASE + raw SQL file), not
#     through Alembic, and import psycopg/pytest only — never the app
#     package itself (REBUILD.md §3 — "never import the app") — so mixing
#     them into `test`'s already-migrated database would mean two
#     different schema-provisioning paths sharing one Postgres instance
#     for no reason.
on:
  push:
    paths:
      - "src/**"
      - "alembic/**"
      - "pyproject.toml"
      - "db/schema.sql"
      - "apitests/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "alembic/**"
      - "pyproject.toml"
      - "db/schema.sql"
      - "apitests/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postwarden
          POSTGRES_PASSWORD: postwarden
          POSTGRES_DB: postwarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postwarden -d postwarden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postwarden:postwarden@localhost:5432/postwarden
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Apply the Alembic baseline
        run: alembic upgrade head

      - name: pytest
        run: pytest apitests -q

  invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postwarden
          POSTGRES_PASSWORD: postwarden
          POSTGRES_DB: postwarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postwarden -d postwarden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTWARDEN_TEST_ADMIN_URL: postgresql://postwarden:postwarden@localhost:5432/postgres
      POSTWARDEN_TEST_URL: postgresql://postwarden:postwarden@localhost:5432/postwarden_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install "psycopg[binary]>=3.2" "pytest>=8.0"

      - name: pytest
        run: pytest tests/test_invariants.py tests/test_cashflow.py -v
