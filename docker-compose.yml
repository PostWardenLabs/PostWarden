services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postwarden
      POSTGRES_PASSWORD: postwarden
      POSTGRES_DB: postwarden
    volumes:
      - pgdata:/var/lib/postgresql/data
      # On first boot, postgres runs these in order to create the schema.
      # Delete 03 if you want a clean start with no demo entries.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/seed_demo.sql:/docker-entrypoint-initdb.d/03_seed_demo.sql:ro
    ports:
      # Bound to loopback only: Power BI / Excel / psql on this same machine
      # can still connect via localhost, but the database isn't reachable
      # from the network. Widen to "5432:5432" deliberately if you need
      # remote BI access — and change the postwarden/postwarden password first.
      # DB_PORT only matters if you're running more than one instance of
      # this compose file on the same host (e.g. demo + beta side by side
      # on the public deploy VM) and need each on its own port — a single
      # self-hosted instance never needs to set it.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postwarden -d postwarden"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      # +psycopg: the SQLAlchemy-flavored URL scheme (see alembic/env.py's
      # own comment) — plain postgresql:// would make SQLAlchemy try to
      # load psycopg2 instead of the psycopg3 driver this project uses.
      DATABASE_URL: postgresql+psycopg://postwarden:postwarden@db:5432/postwarden
      # First-boot convenience: if both are set and no user exists yet,
      # this account is created automatically — see main.py's lifespan
      # hook (modules/auth/service.py's bootstrap_admin_from_env). Leave
      # unset and use `docker compose exec app python -m postwarden.cli
      # create-user <name>` instead if you'd rather not put a password
      # in .env. Never overwrites an existing password.
      POSTWARDEN_ADMIN_USER: ${POSTWARDEN_ADMIN_USER:-}
      POSTWARDEN_ADMIN_PASSWORD: ${POSTWARDEN_ADMIN_PASSWORD:-}
      # Set to true only if uvicorn itself is terminating real HTTPS (not
      # the case for the documented IAP-tunnel or Cloudflare-tunnel
      # deployments — both encrypt at the tunnel layer instead). See
      # config.py's postwarden_cookie_secure comment.
      POSTWARDEN_COOKIE_SECURE: ${POSTWARDEN_COOKIE_SECURE:-}
      # Shows a banner on the login page and pre-fills it with
      # POSTWARDEN_ADMIN_USER/PASSWORD above — off by default on purpose, a
      # normal self-hoster's own login should never appear on their own
      # login page. See main.py's GET /config route.
      POSTWARDEN_DEMO_MODE: ${POSTWARDEN_DEMO_MODE:-}
      # Purely informational — lets Settings > Connect Power BI / Excel show
      # the right port to connect to. Not a real connection: the app never
      # talks to Postgres over this, it just mirrors whatever DB_PORT the
      # "db" service above is actually bound to.
      POSTWARDEN_BI_PORT: ${DB_PORT:-5432}
    ports:
      # Same story as DB_PORT above — only relevant when two instances of
      # this compose file share one host.
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Optional: a Cloudflare Tunnel exposing the app at a real domain, gated
  # by Cloudflare Access (Google/email login) — see deploy/gcp/README.md.
  # Outbound-only: no port published, no firewall change needed anywhere.
  # Opt-in via a profile so plain `docker compose up` (local dev) is
  # unaffected; activate with `docker compose --profile cloudflared up`,
  # and set CLOUDFLARE_TUNNEL_TOKEN in .env (see .env.example).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["cloudflared"]

volumes:
  pgdata:
