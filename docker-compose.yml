services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: libro
      POSTGRES_PASSWORD: libro
      POSTGRES_DB: libro
    volumes:
      - libro_pgdata:/var/lib/postgresql/data
      # On first boot, postgres runs these in order to create the schema.
      # Delete 03 if you want a clean start with no demo entries.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/seed_demo.sql:/docker-entrypoint-initdb.d/03_seed_demo.sql:ro
    ports:
      # Bound to loopback only: Power BI / Excel / psql on this same machine
      # can still connect via localhost, but the database isn't reachable
      # from the network. Widen to "5432:5432" deliberately if you need
      # remote BI access — and change the libro/libro password first.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libro -d libro"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://libro:libro@db:5432/libro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  libro_pgdata:
