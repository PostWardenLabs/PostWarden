services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: libro
      POSTGRES_PASSWORD: libro
      POSTGRES_DB: libro
    volumes:
      - libro_pgdata:/var/lib/postgresql/data
      # On first boot, postgres runs these in order to create the schema.
      # Delete 03 if you want a clean start with no demo entries.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/seed_demo.sql:/docker-entrypoint-initdb.d/03_seed_demo.sql:ro
    ports:
      # Bound to loopback only: Power BI / Excel / psql on this same machine
      # can still connect via localhost, but the database isn't reachable
      # from the network. Widen to "5432:5432" deliberately if you need
      # remote BI access — and change the libro/libro password first.
      # DB_PORT only matters if you're running more than one instance of
      # this compose file on the same host (e.g. demo + beta side by side
      # on the public deploy VM) and need each on its own port — a single
      # self-hosted instance never needs to set it.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libro -d libro"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://libro:libro@db:5432/libro
      # First-boot convenience: if both are set and no user exists yet,
      # this account is created automatically — see app/auth.py. Leave
      # unset and use `docker compose exec app python -m app.cli
      # create-user <name>` instead if you'd rather not put a password
      # in .env. Never overwrites an existing password.
      LIBRO_ADMIN_USER: ${LIBRO_ADMIN_USER:-}
      LIBRO_ADMIN_PASSWORD: ${LIBRO_ADMIN_PASSWORD:-}
      # Set to true only if uvicorn itself is terminating real HTTPS (not
      # the case for the documented IAP-tunnel or Cloudflare-tunnel
      # deployments — both encrypt at the tunnel layer instead). See
      # app/auth.py's COOKIE_SECURE comment.
      LIBRO_COOKIE_SECURE: ${LIBRO_COOKIE_SECURE:-}
    ports:
      # Same story as DB_PORT above — only relevant when two instances of
      # this compose file share one host.
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Optional: a Cloudflare Tunnel exposing the app at a real domain, gated
  # by Cloudflare Access (Google/email login) — see deploy/gcp/README.md.
  # Outbound-only: no port published, no firewall change needed anywhere.
  # Opt-in via a profile so plain `docker compose up` (local dev) is
  # unaffected; activate with `docker compose --profile cloudflared up`,
  # and set CLOUDFLARE_TUNNEL_TOKEN in .env (see .env.example).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["cloudflared"]

volumes:
  libro_pgdata:
