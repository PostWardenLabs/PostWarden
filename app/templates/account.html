{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<p class="page-sub"><a class="quiet-link" href="/settings">&larr; Back to Settings</a></p>

<div class="panel">
  <h2>Change username</h2>
  <form method="post" action="/settings/username" class="grid-form">
    <input type="hidden" name="csrf_token" value="{{ request.state.user.csrf_token }}">
    <label class="field">Username
      <input type="text" name="username" required pattern="[a-z0-9_.-]{3,32}"
             value="{{ request.state.user.username }}"
             title="3-32 characters: lowercase letters, numbers, _ . or -">
    </label>
    <button type="submit">Save username</button>
  </form>
</div>

<div class="panel">
  <h2>Change password</h2>
  <form method="post" action="/settings/password" class="grid-form">
    <input type="hidden" name="csrf_token" value="{{ request.state.user.csrf_token }}">
    <label class="field">Current password
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label class="field">New password
      <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
    </label>
    <label class="field">Confirm new password
      <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit">Change password</button>
  </form>
  <p class="dim small" style="margin-top: 0.6rem; margin-bottom: 0;">Changing your password signs you out everywhere, including here — you'll need to log back in with the new one.</p>
</div>
{% endblock %}
