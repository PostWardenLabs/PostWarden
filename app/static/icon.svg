  <rect x="11" y="6" width="2.4" height="20" fill="#a63c2e"/>
  <rect x="15.5" y="11" width="7" height="1.8" fill="#8fae8b"/>
  <rect x="15.5" y="15.5" width="7" height="1.8" fill="#8fae8b"/>
  <rect x="15.5" y="20" width="7" height="1.8" fill="#8fae8b"/>
